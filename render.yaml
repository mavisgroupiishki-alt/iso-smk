services:
  - type: web
    name: iso-smk-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: VIBE_API_KEY
        sync: false
      # Необязательный резерв для страниц, которые основной распознаватель
      # не прочитал вовремя. Ключ Google Cloud Vision задаётся только в Render.
      - key: GOOGLE_VISION_API_KEY
        sync: false
      # Бесплатный резерв Gemini для страниц, где основной Vision завис или
      # вернул пустой ответ. Ключ задаётся только в Render.
      - key: GEMINI_API_KEY
        sync: false
      # Необязательный второй логин для уже созданного выделенного пространства.
      # Нужен, когда внутренний идентификатор учётной записи и согласованный
      # логин сотрудницы написаны в разных алфавитах.
      - key: IGOR_WORKSPACE_LOGIN_ALIAS
        sync: false
      # Для постоянного серверного хранения подключите Render Persistent Disk
      # и задайте IGOR_DATA_DIR равным его mount path, например /data.
      - key: IGOR_DATA_DIR
        value: /data
